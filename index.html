<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sativasan – Cannabis Médical / Medical Cannabis / Medizinisches Cannabis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --bg2: #0d1117;
    --bg3: #111820;
    --sage: #6a9e74;
    --sage-light: #8fc49d;
    --sage-dim: rgba(106,158,116,0.12);
    --gold: #c9a96e;
    --gold-dim: rgba(201,169,110,0.15);
    --text: #e8ebe8;
    --text-muted: #8a9a8a;
    --text-dim: #4a5a4a;
    --border: rgba(106,158,116,0.2);
    --border-light: rgba(106,158,116,0.08);
    --radius: 4px;
    --radius-lg: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* ─── HEXAGONAL BACKGROUND ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='52' viewBox='0 0 60 52' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='30,1 59,17 59,35 30,51 1,35 1,17' fill='none' stroke='%236a9e74' stroke-width='0.3' stroke-opacity='0.08'/%3E%3C/svg%3E");
    background-size: 60px 52px;
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1140px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 1; }

  /* ─── NAVIGATION ─── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(8,12,16,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-light);
    transition: background 0.3s;
  }

  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 32px;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--sage);
    display: inline-block;
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--sage-light); }

  .lang-switcher {
    display: flex;
    gap: 4px;
  }

  .lang-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
  }

  .lang-btn:hover, .lang-btn.active {
    background: var(--sage-dim);
    border-color: var(--sage);
    color: var(--sage-light);
  }

  /* ─── HERO ─── */
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .hero-glow {
    position: absolute;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(ellipse at center, rgba(106,158,116,0.07) 0%, transparent 65%);
    pointer-events: none;
  }

  .hero-glow-2 {
    position: absolute;
    bottom: -10%;
    right: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(ellipse at center, rgba(201,169,110,0.04) 0%, transparent 65%);
    pointer-events: none;
  }

  .hero-content {
    padding: 140px 0 100px;
    text-align: center;
    max-width: 820px;
    margin: 0 auto;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    color: var(--sage-light);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 36px;
    background: var(--sage-dim);
    animation: fadeUp 0.8s ease both;
  }

  .hero-badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--sage);
    animation: pulse 2.5s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 7vw, 5.2rem);
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  h1 em {
    font-style: italic;
    color: var(--sage-light);
  }

  .hero-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.2rem, 2.5vw, 1.7rem);
    font-weight: 300;
    font-style: italic;
    color: var(--gold);
    letter-spacing: 0.06em;
    margin-bottom: 28px;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  .hero-desc {
    font-size: 1rem;
    color: var(--text-muted);
    max-width: 580px;
    margin: 0 auto 48px;
    line-height: 1.8;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .hero-ctas {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.4s ease both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--sage);
    color: #040a06;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 14px 28px;
    border-radius: var(--radius);
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.25s;
  }

  .btn-primary:hover {
    background: var(--sage-light);
    transform: translateY(-2px);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 14px 28px;
    border-radius: var(--radius);
    text-decoration: none;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.25s;
  }

  .btn-secondary:hover {
    border-color: var(--sage);
    color: var(--sage-light);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 48px;
    margin-top: 80px;
    padding-top: 48px;
    border-top: 1px solid var(--border-light);
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.5s ease both;
  }

  .stat-item { text-align: center; }

  .stat-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem;
    font-weight: 300;
    color: var(--sage-light);
    display: block;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 6px;
    display: block;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── DIVIDER ─── */
  .divider {
    width: 1px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, var(--sage), transparent);
    margin: 0 auto;
    position: relative; z-index: 1;
  }

  /* ─── SECTIONS ─── */
  section { padding: 100px 0; position: relative; }

  .section-tag {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-tag::before {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--sage);
  }

  h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 300;
    line-height: 1.2;
    margin-bottom: 20px;
  }

  h2 em { font-style: italic; color: var(--sage-light); }

  .lead {
    font-size: 1.05rem;
    color: var(--text-muted);
    line-height: 1.85;
    max-width: 600px;
  }


  /* ─── FOUNDERS ─── */
  .founders-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 56px;
  }

  .founder-card {
    background: var(--bg3);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 36px 30px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .founder-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--sage), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .founder-card:hover { border-color: var(--border); transform: translateY(-4px); }
  .founder-card:hover::before { opacity: 1; }

  .founder-icon {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: var(--sage-dim);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin-bottom: 20px;
  }

  .founder-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem; font-weight: 400;
    color: var(--sage-light);
    margin-bottom: 4px;
  }

  .founder-card .founder-subtitle {
    font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 16px;
  }

  .founder-card p {
    font-size: 0.87rem; color: var(--text-muted); line-height: 1.7;
  }

  .founder-tag {
    display: inline-block;
    font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 20px;
    background: var(--gold-dim); color: var(--gold);
    border: 1px solid rgba(201,169,110,0.25);
    margin-top: 14px;
  }

  .founders-banner {
    margin-top: 48px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 40px;
    position: relative; overflow: hidden;
  }

  .founders-banner::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .founders-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }

  .fstat {
    text-align: center;
    padding: 0 20px;
    border-right: 1px solid var(--border-light);
  }
  .fstat:last-child { border-right: none; }

  .fstat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem; font-weight: 300;
    color: var(--gold); display: block; line-height: 1.1;
  }

  .fstat-label {
    font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); display: block; margin-top: 6px; line-height: 1.4;
  }

  @media (max-width: 900px) {
    .founders-grid { grid-template-columns: 1fr; }
    .founders-stats { grid-template-columns: 1fr 1fr; gap: 24px; }
    .fstat { border-right: none; padding: 12px 0; border-bottom: 1px solid var(--border-light); }
    .fstat:nth-child(2n) { border-bottom: none; }
  }

  /* ─── MISSION ─── */
  .mission-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
    margin-top: 60px;
  }

  .mission-visual {
    position: relative;
  }

  .mission-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
    position: relative;
    overflow: hidden;
  }

  .mission-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--sage), transparent);
  }

  .molecule-svg {
    width: 100%;
    height: 220px;
    opacity: 0.6;
  }

  .mission-points {
    list-style: none;
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .mission-points li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--sage-dim);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .check::after {
    content: '';
    width: 6px;
    height: 4px;
    border-left: 1.5px solid var(--sage);
    border-bottom: 1.5px solid var(--sage);
    transform: rotate(-45deg) translate(0px, -1px);
    display: block;
  }

  /* ─── INDICATIONS ─── */
  .indications { background: var(--bg2); }

  .indications-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 60px;
  }

  .indication-card {
    background: var(--bg3);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 32px 28px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .indication-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--sage), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .indication-card:hover {
    border-color: var(--border);
    transform: translateY(-4px);
    background: linear-gradient(135deg, var(--bg3), rgba(106,158,116,0.04));
  }

  .indication-card:hover::after { opacity: 1; }

  .indication-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: var(--sage-dim);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 22px;
  }

  .indication-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 400;
    margin-bottom: 8px;
    color: var(--text);
  }

  .indication-card p {
    font-size: 0.83rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* ─── PIPELINE ─── */
  .pipeline-table {
    margin-top: 60px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .pipeline-header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .pipeline-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border-light);
    align-items: center;
    transition: background 0.2s;
  }

  .pipeline-row:last-child { border-bottom: none; }
  .pipeline-row:hover { background: rgba(106,158,116,0.03); }

  .pipeline-name {
    font-size: 0.95rem;
    color: var(--text);
  }

  .pipeline-stage {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .stage-bar {
    height: 6px;
    background: var(--bg3);
    border-radius: 3px;
    overflow: hidden;
    grid-column: span 2;
    margin-left: 16px;
    display: flex;
    gap: 4px;
  }

  .stage-segment {
    height: 100%;
    border-radius: 3px;
    flex: 1;
  }

  .stage-active { background: var(--sage); }
  .stage-inactive { background: var(--border-light); }

  .status-badge {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-flex;
  }

  .status-active { background: var(--sage-dim); color: var(--sage-light); border: 1px solid var(--border); }
  .status-pending { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(201,169,110,0.3); }
  .status-planned { background: rgba(255,255,255,0.04); color: var(--text-dim); border: 1px solid var(--border-light); }

  /* ─── STRATEGY ─── */
  .strategy { background: var(--bg2); }

  .strategy-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
    margin-top: 60px;
  }

  .strategy-card {
    background: var(--bg3);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 36px 30px;
    transition: all 0.3s;
  }

  .strategy-card:hover {
    border-color: var(--border);
    transform: translateY(-3px);
  }

  .strategy-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    font-weight: 300;
    color: var(--border);
    line-height: 1;
    margin-bottom: 16px;
  }

  .strategy-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    margin-bottom: 12px;
    color: var(--sage-light);
  }

  .strategy-card p {
    font-size: 0.87rem;
    color: var(--text-muted);
    line-height: 1.7;
  }

  /* ─── CONTACT ─── */
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 80px;
    margin-top: 60px;
    align-items: start;
  }

  .contact-info h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    margin-bottom: 16px;
    color: var(--text);
  }

  .contact-info p {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.8;
    margin-bottom: 32px;
  }

  .contact-detail {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .contact-detail-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: var(--sage-dim);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .form-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
    position: relative;
    overflow: hidden;
  }

  .form-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--sage), transparent);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group { margin-bottom: 20px; }

  .form-group label {
    display: block;
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--sage);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  .form-group select option { background: var(--bg); }

  .form-submit {
    width: 100%;
    background: var(--sage);
    color: #040a06;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 16px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.25s;
    margin-top: 8px;
  }

  .form-submit:hover {
    background: var(--sage-light);
    transform: translateY(-2px);
  }

  .form-note {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }

  /* ─── SUCCESS MESSAGE ─── */
  .form-success {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }

  .form-success-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--sage-dim);
    border: 1px solid var(--sage);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 24px;
  }

  .form-success h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    margin-bottom: 12px;
  }

  .form-success p { font-size: 0.9rem; color: var(--text-muted); }

  /* ─── FOOTER ─── */
  footer {
    background: var(--bg);
    border-top: 1px solid var(--border-light);
    padding: 48px 0;
    position: relative; z-index: 1;
  }

  .footer-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .footer-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .footer-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }

  .footer-links a {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.06em;
    transition: color 0.2s;
  }

  .footer-links a:hover { color: var(--sage-light); }

  .footer-copy {
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  /* ─── REGULATORY BANNER ─── */
  .reg-banner {
    background: rgba(201,169,110,0.04);
    border: 1px solid rgba(201,169,110,0.15);
    border-radius: var(--radius);
    padding: 20px 28px;
    margin-top: 60px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .reg-banner-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }

  .reg-banner p {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .reg-banner strong { color: var(--gold); }

  /* ─── SCROLL REVEAL ─── */
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal-delay-1 { transition-delay: 0.1s; }
  .reveal-delay-2 { transition-delay: 0.2s; }
  .reveal-delay-3 { transition-delay: 0.3s; }
  .reveal-delay-4 { transition-delay: 0.4s; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 900px) {
    .mission-grid { grid-template-columns: 1fr; gap: 40px; }
    .contact-grid { grid-template-columns: 1fr; gap: 40px; }
    .strategy-grid { grid-template-columns: 1fr; }
    .nav-links { display: none; }
    .pipeline-header, .pipeline-row { grid-template-columns: 1fr 1fr; }
    .pipeline-header span:nth-child(3),
    .pipeline-row .stage-bar,
    .pipeline-row span:nth-child(3) { display: none; }
  }

  @media (max-width: 600px) {
    .container { padding: 0 20px; }
    .nav-inner { padding: 0 20px; }
    .hero-stats { gap: 24px; }
    .form-row { grid-template-columns: 1fr; }
    .indications-grid { grid-template-columns: 1fr; }
  }

  /* ─── LANG HIDDEN ─── */
  [data-lang] { display: none; }
  [data-lang].active { display: block; }
  .lang-inline[data-lang] { display: none; }
  .lang-inline[data-lang].active { display: inline; }
</style>
</head>

// ─── CURRENT LANGUAGE ───────────────────────────────────────
let currentLang = 'fr';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;

  // Update buttons
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === lang.toUpperCase());
  });

  // Render dynamic content
  renderAll();
}

function t(key) { return T[currentLang][key] || T['fr'][key] || key; }

function renderAll() {
  // Simple text keys
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (typeof val === 'string') el.innerHTML = val;
  });

  // Placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    el.placeholder = t(key);
  });

  // Select options
  const select = document.getElementById('profile-select');
  if (select) {
    select.querySelectorAll('[data-i18n]').forEach(opt => {
      opt.textContent = t(opt.getAttribute('data-i18n'));
    });
  }

  renderMissionPoints();
  renderFounders();
  renderIndications();
  renderPipelineRows();
  renderStrategyCards();
}

function renderFounders() {
  const grid = document.getElementById('founders-grid');
  const statsEl = document.getElementById('founders-stats');
  if (!grid) return;
  const cards = T[currentLang]['fondateurs.cards'] || [];
  const stats = T[currentLang]['fondateurs.stats'] || [];

  grid.innerHTML = cards.map((c, i) => `
    <div class="founder-card reveal reveal-delay-${i + 1}">
      <div class="founder-icon">${c.icon}</div>
      <h3>${c.name}</h3>
      <div class="founder-subtitle">${c.subtitle}</div>
      <p>${c.desc}</p>
      <span class="founder-tag">${c.tag}</span>
    </div>
  `).join('');

  if (statsEl) {
    statsEl.innerHTML = stats.map(s => `
      <div class="fstat">
        <span class="fstat-num">${s.num}</span>
        <span class="fstat-label">${s.label}</span>
      </div>
    `).join('');
  }
  observeReveal();
}

function renderMissionPoints() {
  const list = document.getElementById('mission-points');
  if (!list) return;
  const points = T[currentLang]['mission.points'] || [];
  list.innerHTML = points.map(p => `
    <li><span class="check"></span><span>${p}</span></li>
  `).join('');
}

function renderIndications() {
  const grid = document.getElementById('indications-grid');
  if (!grid) return;
  const items = T[currentLang]['indications'] || [];
  grid.innerHTML = items.map((item, i) => `
    <div class="indication-card reveal reveal-delay-${(i % 4) + 1}">
      <div class="indication-icon">${item.icon}</div>
      <h3>${item.title}</h3>
      <p>${item.desc}</p>
    </div>
  `).join('');
  observeReveal();
}

function renderPipelineRows() {
  const container = document.getElementById('pipeline-rows');
  if (!container) return;
  const rows = T[currentLang]['pipeline.rows'] || [];
  const statusLabels = { active: { fr: 'En cours', en: 'In progress', de: 'Laufend' }, pending: { fr: 'R&D', en: 'R&D', de: 'F&E' }, planned: { fr: 'Planifié', en: 'Planned', de: 'Geplant' } };
  const totalStages = 5;

  container.innerHTML = rows.map(row => {
    const filledSegs = Math.max(1, totalStages - row.progress + 1);
    const emptySegs = totalStages - filledSegs;
    const segs = Array(filledSegs).fill('<span class="stage-segment stage-active"></span>').join('') +
                 Array(emptySegs).fill('<span class="stage-segment stage-inactive"></span>').join('');
    const lbl = statusLabels[row.status]?.[currentLang] || row.stage;
    const statusClass = `status-${row.status}`;
    return `
      <div class="pipeline-row">
        <span class="pipeline-name">${row.name}</span>
        <span class="pipeline-stage"><span class="${statusClass} status-badge">${lbl}</span></span>
        <div class="stage-bar">${segs}</div>
        <span class="pipeline-stage">${row.profile}</span>
      </div>
    `;
  }).join('');
}

function renderStrategyCards() {
  const grid = document.getElementById('strategy-grid');
  if (!grid) return;
  const cards = T[currentLang]['strategy.cards'] || [];
  grid.innerHTML = cards.map((card, i) => `
    <div class="strategy-card reveal reveal-delay-${i + 1}">
      <div class="strategy-num">${card.num}</div>
      <h3>${card.title}</h3>
      <p>${card.desc}</p>
    </div>
  `).join('');
  observeReveal();
}

// ─── SCROLL REVEAL ──────────────────────────────────────────
function observeReveal() {
  const els = document.querySelectorAll('.reveal:not(.visible)');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
  }, { threshold: 0.1 });
  els.forEach(el => observer.observe(el));
}

// ─── FORM SUBMIT ────────────────────────────────────────────
function handleSubmit(e) {
  e.preventDefault();
  const form = document.getElementById('contact-form');
  const success = document.getElementById('form-success');
  form.style.display = 'none';
  success.style.display = 'block';
}

// ─── INIT ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderAll();
  observeReveal();
});
</script>
